# render.yaml — deploy do openclaw-node no Render.com
services:
  - type: web
    name: openclaw-node
    runtime: docker
    repo: https://github.com/mannowell/openclaw-node
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: TAILSCALE_AUTHKEY
        sync: false  # definis no painel do Render (ou via API)