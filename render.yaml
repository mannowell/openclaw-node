# render.yaml — deploy do openclaw-node no Render.com
# Serviço: API de scraping (porta 10000) + OpenClaw gateway (porta 18789)
# ⚠️ Estado do OpenClaw é gerado por ENV VARS a cada boot (idempotente);
#    workspaces/SOUL/memória NÃO persistem entre deploys (por design no Render).
services:
  - type: web
    name: openclaw-node
    runtime: docker
    repo: https://github.com/mannowell/openclaw-node
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      # Tailscale: chave de auth (reutilizável!) — definir no painel do Render
      - key: TAILSCALE_AUTHKEY
        sync: false  # definida no painel do Render (ou via API)
      # IA: use ao menos UMA das chaves abaixo (nome EXATO importa!)
      # GROQ_API_KEY | OPENROUTER_API_KEY | OPENAI_API_KEY | DEEPSEEK_API_KEY | TOGETHER_API_KEY | ANTHROPIC_API_KEY
      - key: GROQ_API_KEY
        sync: false
      # Telegram: token do bot (criar via @BotFather) — definir no painel.
      # TELEGRAM_BOT_TOKEN_2 tem prioridade sobre TELEGRAM_BOT_TOKEN (swap sem apagar).
      #   TELEGRAM_BOT_TOKEN_2 = token do bot Dev @Devmannohermes_bot  (8815143115:...)
      #   TELEGRAM_BOT_TOKEN   = token do bot Boss @bossmanno_bot     (8419575752:...)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN_2
        sync: false
      # OPENCLAW_OWNER_ID: Telegram ID do dono. Pode ser "7648987349" ou
      # "telegram:7648987349" — o init-openclaw.mjs normaliza para "telegram:<id>"
      # (formato exato exigido pelo allowlist do OpenClaw para DMs).
      - key: OPENCLAW_OWNER_ID
        sync: false
      # OPENCLAW_PROVIDERS (opcional): limitar providers p/ reduzir RAM no boot.
      # Ex.: "groq" = só Groq (menos plugins instalados, menos risco de OOM no free).
      - key: OPENCLAW_PROVIDERS
        sync: false